name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:       
      - name: languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          filename: languages.svg
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage, lines
      - name: template1
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: "header"
          filename: repo_glinks.svg
          template: repository
          user: glakulin
          repo: glinks
          plugin_introduction: yes
          extras_css: |
            .contributions { display: none !important; }
            .environments { display: none !important; }
      - name: template2
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: "header"
          filename: repo_glak_tspk_bot.svg
          template: repository
          user: glakulin
          repo: glak_tspk_bot
          plugin_introduction: yes
          extras_css: |
            .contributions { display: none !important; }
            .environments { display: none !important; }
